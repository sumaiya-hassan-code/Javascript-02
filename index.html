<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body
    class="min-h-screen bg-linear-to-br from-red-300 via-pink-300 to-pink-500 flex items-center">

    <div  class="bg-white/60 p-10 rounded-xl mx-auto flex flex-col justify-between items-center backdrop-blur-md shadow-2xl">
            <div class="flex justify-around items-center gap-x-2 m-2">
                <button id="dark" class="p-2 bg-white border-2 border-pink-300 rounded-2xl text-pink-300">Dark</button>
                <button id="light" class="p-2 bg-white border-2 border-pink-300 rounded-2xl text-pink-300">Light</button>
            </div>
            <div class="flex justify-between items-center gap-x-2 m-2">
                <input 
                id="input"
                class="p-2 bg-white border border-gray-300 focus:outline-none focus:ring-1 focus:ring-pink-300 rounded-2xl "
                type="text" 
                placeholder="Put a year to identify leap year"
                >
                <button
                id="button"
                class="p-2 bg-white border-2 border-pink-300 rounded-2xl text-pink-300">
                Submit</button>
            </div>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
